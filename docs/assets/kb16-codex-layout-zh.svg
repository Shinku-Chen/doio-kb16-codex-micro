  <text x="42" y="541" font-size="23" class="center strong">C</text>
  <text x="66" y="530" font-size="16" class="strong">编码器：逆 ENC_CC / 顺 ENC_CW</text>
  <text x="66" y="550" font-size="12.5" class="muted">按下：ENC_SW</text>
  <text x="24" y="590" font-size="17" class="strong">MO(1) 按住普通 L1 · TO(0) 回 Codex</text>
