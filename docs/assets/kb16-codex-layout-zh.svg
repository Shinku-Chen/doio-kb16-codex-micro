<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title description">
  <title id="title">KB16 · Codex 键位</title>
  <desc id="description">0.6.0 开发版 L0：六个 AG、七个 ACT 固定。五个空余位置由 VIA 第一页直接配置，无固定长按退出。建议 MO(1) 按住进入普通 L1，TO(0) 返回 Codex。A/B 旋转为 X/Y，C 编码器固定。配色不代表实际灯色。</desc>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #17243c; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .muted { fill: #53657d; }
    .center { text-anchor: middle; }
    .strong { font-weight: 700; }
  </style>
  <rect width="480" height="650" rx="18" fill="#ffffff"/>
  <text x="24" y="35" font-size="25" class="strong">KB16 · Codex 键位</text>
